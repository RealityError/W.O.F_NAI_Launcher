name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v1.0.0"
        required: true
        type: string
      include_macos:
        description: Include the verified macOS universal package
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      public_version: ${{ steps.version.outputs.public_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          lfs: false

      - name: Verify tag matches pubspec version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $match = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          if (!$match) {
            throw 'pubspec.yaml does not contain a version field.'
          }
          $version = $match.Matches[0].Groups[1].Value.Trim()
          $publicVersion = $version -replace '\+.*$', ''
          $expectedTag = "v$publicVersion"
          if ('${{ env.RELEASE_TAG }}' -ne $expectedTag) {
            throw "Release tag ${{ env.RELEASE_TAG }} does not match pubspec version $version. Expected $expectedTag."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "public_version=$publicVersion" >> $env:GITHUB_OUTPUT
          "prerelease=$($publicVersion.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  build-windows:
    name: Build Windows
    runs-on: windows-2022
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          lfs: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4
        with:
          nuget-version: latest

      - name: Verify NuGet
        shell: pwsh
        run: ./scripts/verify_nuget.ps1

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Pull LFS databases
        shell: pwsh
        run: |
          git lfs install
          git lfs pull --include="assets/databases/*.db"

      - name: Verify bundled databases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            "assets/databases/tag_catalog.db",
            "assets/databases/cooccurrence.db"
          )
          foreach ($file in $files) {
            if (!(Test-Path $file)) {
              throw "Missing database: $file"
            }
            $info = Get-Item $file
            if ($info.Length -lt 1024) {
              throw "Database looks too small, probably an LFS pointer: $file"
            }
            $stream = [System.IO.File]::OpenRead($file)
            try {
              $buffer = New-Object byte[] 16
              [void]$stream.Read($buffer, 0, 16)
              $header = [System.Text.Encoding]::ASCII.GetString($buffer)
              if (!$header.StartsWith("SQLite format 3")) {
                throw "Database is not a SQLite file: $file"
              }
            } finally {
              $stream.Dispose()
            }
          }

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate bundled autocomplete databases
        run: dart run tool/tag_catalog/verify_bundled_databases.dart

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Generate code
        run: dart run tool/generate.dart

      - name: Build Windows release
        run: flutter build windows --release --no-pub --no-tree-shake-icons

      - name: Sign Windows application
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            Write-Host 'Windows signing certificate is not configured; skipping application signing.'
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'nai-launcher-signing.pfx'
          [IO.File]::WriteAllBytes(
            $certificatePath,
            [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64)
          )
          ./scripts/sign_windows_binary.ps1 `
            -Path 'build/windows/x64/runner/Release/nai_launcher.exe' `
            -CertificatePath $certificatePath `
            -CertificatePassword $env:WINDOWS_SIGNING_CERT_PASSWORD

      - name: Prepare Node runtime and Agent dependencies
        shell: pwsh
        run: ./scripts/prepare_windows_node_runtime.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'wof-node-runtime')

      - name: Package Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/package_windows_release.ps1 `
            -Version '${{ needs.prepare.outputs.version }}' `
            -SkipFlutterBuild `
            -NodeRuntimeDirectory (Join-Path $env:RUNNER_TEMP 'wof-node-runtime')

      - name: Sign Windows installer
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $certificatePath = Join-Path $env:RUNNER_TEMP 'nai-launcher-signing.pfx'
          if (!(Test-Path -LiteralPath $certificatePath)) {
            Write-Host 'Windows signing certificate is not configured; skipping installer signing.'
            exit 0
          }
          ./scripts/sign_windows_binary.ps1 `
            -Path 'dist/WOF_NAI_Studio_Windows_${{ needs.prepare.outputs.public_version }}_Setup.exe' `
            -CertificatePath $certificatePath `
            -CertificatePassword $env:WINDOWS_SIGNING_CERT_PASSWORD

      - name: Refresh signed artifact checksums
        shell: pwsh
        run: python scripts/windows_release_payload.py checksums --output 'dist/WOF_NAI_Studio_Windows_${{ needs.prepare.outputs.public_version }}_Setup.exe' --output 'dist/WOF_NAI_Studio_Windows_${{ needs.prepare.outputs.public_version }}_Portable.zip'

      - name: Remove signing certificate
        if: ${{ always() }}
        shell: pwsh
        run: Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'nai-launcher-signing.pfx') -Force -ErrorAction SilentlyContinue

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/WOF_NAI_Studio_Windows_*_Setup.exe
            dist/WOF_NAI_Studio_Windows_*_Portable.zip
            dist/*.sha256
            dist/checksums.txt
          if-no-files-found: error

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          lfs: true
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/**/*.gradle', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Resolve dependencies
        run: flutter pub get

      # 所有分发出去的 APK 必须是同一把密钥签的，否则应用内更新会在安装阶段被系统
      # 以 INSTALL_FAILED_UPDATE_INCOMPATIBLE 拒绝。密钥来自 GitHub Secrets，
      # 还原成 android/app/wof-release.jks 并写 android/key.properties（都不入库）。
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 未配置：构建会退回临时 debug 签名，装不上已发布版本"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/wof-release.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=app/wof-release.jks"
          } > android/key.properties
          echo "签名密钥已还原（$KEY_ALIAS）"

      - name: Generate localizations and code
        run: |
          flutter gen-l10n
          dart run tool/generate.dart

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi --target-platform android-arm64

      - name: Verify APK signature
        run: |
          apksigner=$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "== $apk"
            "$apksigner" verify --print-certs "$apk" | grep -E 'certificate DN|SHA-256 digest'
          done

      - name: List artifacts
        run: ls -lh build/app/outputs/flutter-apk/

      # 与 Windows 产物一起进入同一个 Release；文件名保留 ABI 字样，
      # AndroidUpdateLogic.selectApkAsset 按它匹配设备 ABI，不能改名。
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apks
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-*-release.apk

  build-macos:
    if: github.event_name == 'workflow_dispatch' && inputs.include_macos
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/macos-build.yml
    with:
      checkout-ref: ${{ inputs.tag }}
      version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Publish GitHub Release
    if: >-
      ${{ !cancelled() && needs.prepare.result == 'success' &&
          needs.build-windows.result == 'success' &&
          needs.build-android.result == 'success' &&
          (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') }}
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-windows
      - build-android
      - build-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate release metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/generate_release_metadata.ps1 `
            -AssetDirectory release-assets `
            -OutputDirectory release-assets `
            -Version '${{ needs.prepare.outputs.version }}' `
            -Tag '${{ env.RELEASE_TAG }}' `
            -Repository '${{ github.repository }}'

      - name: Show assets
        run: ls -lh release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: W.O.F NAI Studio ${{ env.RELEASE_TAG }}
          body_path: release-assets/release_notes_${{ env.RELEASE_TAG }}.md
          files: release-assets/*
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease }}
